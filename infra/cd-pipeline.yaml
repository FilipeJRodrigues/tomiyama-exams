AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Tomiyama Exams - esteira de deploy (CD) do backend: CodePipeline V2 + CodeBuild + CodeConnections,
  com change set e aprovação manual. Stack separada da stack do app (card #68).

# CodePipeline, not GitHub Actions: the project's SCP denies iam:*Provider*, so
# there is no GitHub OIDC provider (#177). Runbook and rationale: section
# "Deploy pela esteira (CodePipeline)" of backend/README.md.
#
# Name this stack so it does NOT start with "<AppStackName>-" (suggested:
# tomiyama-cd-dev): the execution role manages "<AppStackName>-*", and the
# buckets here get names from this stack's name. The roles and policies here
# live under /cd/ (no hyphen), out of the reach of "role/<AppStackName>-*".
# The indirect path, through a function role that the execution role writes,
# is closed by FunctionBoundaryPolicy (#179).

Parameters:
  AppStackName:
    Type: String
    Default: tomiyama-dev
    # Lowercase: S3 lowercases generated bucket names, and the execution role
    # scopes S3 by "<AppStackName>-*". Up to 25: cd-<AppStackName> fits the
    # 32-character connection name, and generated names keep the prefix.
    AllowedPattern: "^[a-z][a-z0-9-]{0,24}$"
    ConstraintDescription: minúsculas, números e hífen; começa com letra; até 25 caracteres.
    Description: Nome da stack do app que a esteira atualiza (a mesma do sam deploy manual).
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: Parâmetro Environment da stack do app.
  AdminEmail:
    Type: String
    NoEcho: true
    # No quotes, backslashes or spaces: the value goes into the ParameterOverrides JSON.
    AllowedPattern: '^[^"\\\s]+@[^"\\\s]+$'
    # Longest SMTP address, 254 octets (RFC 5321); see the count in AllowedOrigin.
    MaxLength: 254
    ConstraintDescription: um e-mail de até 254 caracteres, sem aspas, barras invertidas ou espaços.
    Description: >-
      Parâmetro AdminEmail da stack do app. Use o valor atual da stack (describe-stacks): mudar
      o e-mail substitui o examinador inicial.
  AllowedOrigin:
    Type: String
    Default: http://localhost:5173
    # ASCII, no quotes, backslashes or spaces: the value goes into the
    # ParameterOverrides JSON, and the app accepts only lowercase ASCII origins.
    AllowedPattern: "^[a-z0-9:/.,-]+$"
    # ParameterOverrides: at most 1,000 characters (CodePipeline quotas) and 1 KB
    # (CloudFormation action reference). Longest JSON: 115 fixed + Environment 4
    # + AdminEmail 254 (no real address passes 254 octets) + BudgetLimitUsd 10 +
    # AllowedOrigin 500 + FunctionPermissionsBoundary 89 ("arn:" + partition, up
    # to 10 + ":iam::" + account 12 + ":policy/cd/cd-" + AppStackName, up to 25 +
    # "-function-boundary") = 972 characters and bytes. It was 600 before #179.
    MaxLength: 500
    ConstraintDescription: >-
      origens separadas por vírgula, sem espaços, até 500 caracteres: letras minúsculas,
      números e os caracteres : / . , -
    Description: Parâmetro AllowedOrigin da stack do app (origens separadas por vírgula, sem espaços).
  BudgetLimitUsd:
    # String, not Number: ParameterOverrides passes text, and a Number takes
    # neither AllowedPattern nor MaxLength (see AllowedOrigin). No sign.
    Type: String
    Default: "1"
    AllowedPattern: '^[0-9]{1,7}(\.[0-9]{1,2})?$'
    ConstraintDescription: >-
      valor em dólares com até 7 dígitos inteiros e até 2 casas decimais, separadas por ponto
      (exemplos: 1, 12.5), sem sinal nem notação científica.
    Description: Parâmetro BudgetLimitUsd da stack do app.
  RepositoryId:
    Type: String
    Default: FilipeJRodrigues/tomiyama-exams
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    Description: Repositório do GitHub (dono/nome, com as maiúsculas certas).
  BranchName:
    Type: String
    Default: main
    AllowedPattern: "^[A-Za-z0-9._/-]+$"
    Description: >-
      Branch de onde sai todo deploy. O build só aceita commit da linha de primeiro pai dela
      (merge de PR ou commit feito direto nela).
  SamCliVersion:
    Type: String
    Default: 1.171.0
    AllowedPattern: '^\d+\.\d+\.\d+$'
    Description: Versão fixada do AWS SAM CLI instalada no build (pip).

Resources:
  # ------------------------------------------------------------- Connection
  # Born PENDING: complete it once in the console (README, "Concluir a conexão").
  GitHubConnection:
    Type: AWS::CodeConnections::Connection
    Properties:
      ConnectionName: !Sub cd-${AppStackName}
      ProviderType: GitHub

  # ---------------------------------------------------------------- Buckets
  # Pipeline artifacts; everything expires after 30 days.
  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: ExpirePipelineArtifacts
            Status: Enabled
            ExpirationInDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  ArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ArtifactsBucket.Arn
              - !Sub ${ArtifactsBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # "sam package" output. No expiration, on purpose: a failed deploy rolls the
  # functions back to the previous package, which must still exist (README).
  PackagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  PackagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PackagesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt PackagesBucket.Arn
              - !Sub ${PackagesBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ------------------------------------------------------------------ Build
  # Build logs only (no student data): deleted with this stack.
  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/codebuild/${AWS::StackName}
      RetentionInDays: 30

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cd-${AppStackName}-build
      Path: /cd/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
                aws:SourceArn: !Sub arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/${AWS::StackName}-build
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt BuildLogGroup.Arn
              - Sid: PipelineArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub ${ArtifactsBucket.Arn}/*
              - Sid: FunctionPackages
                # HeadObject (s3:GetObject) skips a package already there.
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${PackagesBucket.Arn}/${AppStackName}/*
              - Sid: BucketMetadata
                Effect: Allow
                Action:
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt ArtifactsBucket.Arn
                  - !GetAtt PackagesBucket.Arn
              # Full clone and the "git fetch" of the main check, this repository
              # only; both prefixes (CodePipeline connection action page).
              - Sid: UseConnectionCodeConnections
                Effect: Allow
                Action: codeconnections:UseConnection
                Resource: !GetAtt GitHubConnection.ConnectionArn
                Condition:
                  StringEquals:
                    codeconnections:FullRepositoryId: !Ref RepositoryId
              - Sid: UseConnectionCodeStarConnections
                Effect: Allow
                Action: codestar-connections:UseConnection
                Resource: !GetAtt GitHubConnection.ConnectionArn
                Condition:
                  StringEquals:
                    codestar-connections:FullRepositoryId: !Ref RepositoryId

  BuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AWS::StackName}-build
      Description: Confere que o commit está na linha principal do main, roda sam build e sam package.
      ServiceRole: !GetAtt BuildRole.Arn
      TimeoutInMinutes: 20
      QueuedTimeoutInMinutes: 60
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        # arm1.small (2 vCPU, 4 GiB), in the free tier; the functions are arm64 too.
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-aarch64-standard:4.0
        EnvironmentVariables:
          - Name: PACKAGES_BUCKET
            Value: !Ref PackagesBucket
          - Name: PACKAGES_PREFIX
            Value: !Ref AppStackName
          - Name: MAIN_BRANCH
            Value: !Ref BranchName
          - Name: SAM_CLI_VERSION
            Value: !Ref SamCliVersion
          - Name: SAM_CLI_TELEMETRY
            Value: "0"
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup
        S3Logs:
          Status: DISABLED
      Source:
        Type: CODEPIPELINE
        # Inline on purpose: a buildspec in the repository would let any commit
        # change the build and its commit check, and the first deploy (c603913)
        # has none. The check runs in pre_build, before any code of the commit
        # and before pip, and passes only the first-parent line of main (merge of
        # a PR or a commit made on main). SOURCE_COMMIT comes from the pipeline.
        # The indirect path, through a function role, is closed by #179.
        BuildSpec: |
          version: 0.2
          env:
            shell: bash
            git-credential-helper: yes
          phases:
            install:
              runtime-versions:
                python: "3.12"
            pre_build:
              commands:
                - |
                  set -eo pipefail
                  COMMIT="$(git rev-parse HEAD)"
                  echo "Commit escolhido: $COMMIT"
                  if [ -n "$SOURCE_COMMIT" ] && ! [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
                    echo "ERRO: o clone está no commit $COMMIT, mas a execução pediu \"$SOURCE_COMMIT\", que não é o SHA completo de um commit (40 caracteres hexadecimais). Informe o SHA completo, que sai de git rev-parse $SOURCE_COMMIT, e rode a esteira com ele."
                    exit 1
                  fi
                  if [ -n "$SOURCE_COMMIT" ] && [ "$SOURCE_COMMIT" != "$COMMIT" ]; then
                    echo "ERRO: o clone está no commit $COMMIT, mas a execução pediu $SOURCE_COMMIT. Rode a esteira de novo."
                    exit 1
                  fi
                  if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
                    git fetch --quiet --unshallow origin
                  fi
                  if ! git fetch --quiet --no-tags origin "+refs/heads/$MAIN_BRANCH:refs/remotes/origin/$MAIN_BRANCH"; then
                    echo "ERRO: não foi possível buscar o $MAIN_BRANCH no GitHub para conferir o commit. Confira se a conexão está disponível (AVAILABLE) e rode a esteira de novo."
                    exit 1
                  fi
                  if ! git merge-base --is-ancestor "$COMMIT" "origin/$MAIN_BRANCH"; then
                    echo "ERRO: o commit $COMMIT não está no histórico do $MAIN_BRANCH. A esteira só publica commits que já entraram no $MAIN_BRANCH por PR. Escolha o commit de merge do PR no $MAIN_BRANCH e rode de novo."
                    exit 1
                  fi
                  # grep without -q reads the whole list: with pipefail, an early
                  # exit would kill git rev-list (SIGPIPE) and refuse a good commit.
                  if ! git rev-list --first-parent "origin/$MAIN_BRANCH" | grep -xF "$COMMIT" > /dev/null; then
                    echo "ERRO: o commit $COMMIT está no histórico do $MAIN_BRANCH, mas veio de dentro de uma branch mesclada. A esteira só publica commits da linha principal do $MAIN_BRANCH: o commit de merge de um PR, ou um commit feito direto no $MAIN_BRANCH. Escolha o commit de merge do PR (git log --first-parent --oneline origin/$MAIN_BRANCH) e rode de novo."
                    exit 1
                  fi
                  echo "OK: o commit $COMMIT está na linha principal do $MAIN_BRANCH (primeiro pai)."
            build:
              commands:
                - python -m venv /tmp/sam-cli
                - /tmp/sam-cli/bin/pip install --quiet --disable-pip-version-check "aws-sam-cli==$SAM_CLI_VERSION"
                - /tmp/sam-cli/bin/sam --version
                - |
                  set -eo pipefail
                  cd infra
                  /tmp/sam-cli/bin/sam build --template-file template.yaml
                  /tmp/sam-cli/bin/sam package \
                    --template-file .aws-sam/build/template.yaml \
                    --s3-bucket "$PACKAGES_BUCKET" \
                    --s3-prefix "$PACKAGES_PREFIX" \
                    --output-template-file "$CODEBUILD_SRC_DIR/packaged.yaml"
          artifacts:
            files:
              - packaged.yaml

  # ----------------------------------------- Function permissions boundary
  # Permissions boundary of every function role (#179; README, "Limite de
  # permissões dos papéis das funções"). Attached to no role: it grants nothing
  # by itself. The pipeline passes its ARN to the app stack.
  # Allow: only what the functions use today, on the app's resources
  # (tests/test_cd_function_boundary.py). A new action in a function's Policies
  # comes here first, or the function fails with AccessDenied when it runs.
  # Deny: IAM, STS and this stack's resources; the explicit Deny also wins over
  # a resource-based grant to a function's session.
  # No Description, and keep ManagedPolicyName and Path: changing any of them
  # replaces the policy (new ARN) while the roles still use the old one.
  FunctionBoundaryPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub cd-${AppStackName}-function-boundary
      Path: /cd/
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Items of the app's tables and indexes (SAM policies and inline statements).
          - Sid: AppTables
            Effect: Allow
            Action:
              - dynamodb:BatchGetItem
              - dynamodb:BatchWriteItem
              - dynamodb:ConditionCheckItem
              - dynamodb:DeleteItem
              - dynamodb:DescribeTable
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:UpdateItem
            Resource:
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppStackName}-*
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppStackName}-*/index/*
          # Logos and signatures: objects only, never the bucket.
          - Sid: AppImages
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
            Resource: !Sub arn:${AWS::Partition}:s3:::${AppStackName}-*/*
          # AWSLambdaBasicExecutionRole grants these on "*"; the functions log only
          # to /aws/lambda/<AppStackName> (Globals.LoggingConfig).
          - Sid: AppFunctionLogs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppStackName}
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppStackName}:*
          # Pool ids are random: the pools of this account and Region.
          - Sid: AppUserPools
            Effect: Allow
            Action:
              - cognito-idp:AdminAddUserToGroup
              - cognito-idp:ListUsersInGroup
            Resource: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*
          # Asynchronous copy and deletion of a requirement profile.
          - Sid: AppFunctions
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppStackName}-*
          - Sid: NoIamNorSts
            Effect: Deny
            Action:
              - iam:*
              - sts:*
            Resource: "*"
          # The pipeline by name: a Ref would be circular (its ParameterOverrides
          # refers to this policy). Every connection: the functions use none.
          - Sid: NeverTheCdStack
            Effect: Deny
            Action: "*"
            Resource:
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cd/*
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/cd/*
              - !GetAtt ArtifactsBucket.Arn
              - !Sub ${ArtifactsBucket.Arn}/*
              - !GetAtt PackagesBucket.Arn
              - !Sub ${PackagesBucket.Arn}/*
              - !GetAtt BuildProject.Arn
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${BuildLogGroup}
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${BuildLogGroup}:*
              - !Sub arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${AWS::StackName}
              - !Sub arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${AWS::StackName}/*
              - !Sub arn:${AWS::Partition}:codeconnections:${AWS::Region}:${AWS::AccountId}:connection/*
              - !Sub arn:${AWS::Partition}:codestar-connections:${AWS::Region}:${AWS::AccountId}:connection/*
              - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*

  # ------------------------------------------- CloudFormation execution role
  # CloudFormation's service role for every operation on the app stack (manual
  # "sam deploy" included): what the handlers of the app's resource types ask,
  # on the app's resources only, minus features it does not use (KMS, VPC,
  # streams, replicas, imports) and data access (LGPD). README, "Papéis e
  # permissões".
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cd-${AppStackName}-cfn-exec
      Path: /cd/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      # CloudFormation checks each transform of infra/template.yaml against the
      # service role (the first real run, 2026-11-18, failed without it). Only
      # the transform ARNs, no stack: this alone creates no change set. A new
      # transform goes here too (the regression test of #68 reads them).
      Policies:
        - PolicyName: app-template-transforms
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AppTemplateTransforms
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/LanguageExtensions
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31

  # Resource permissions in managed policies (6,144 characters each): the inline
  # policies of a role share 10,240.
  ExecutionComputePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub cd-${AppStackName}-cfn-exec-compute
      Path: /cd/
      Roles:
        - !Ref CloudFormationExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Function, Permission and EventInvokeConfig of "<AppStackName>-*".
          - Sid: LambdaFunctions
            Effect: Allow
            Action:
              - lambda:CreateFunction
              - lambda:DeleteFunction
              - lambda:GetFunction
              - lambda:GetFunctionConfiguration
              - lambda:UpdateFunctionCode
              - lambda:UpdateFunctionConfiguration
              - lambda:PublishVersion
              - lambda:TagResource
              - lambda:UntagResource
              - lambda:ListTags
              - lambda:PutFunctionConcurrency
              - lambda:DeleteFunctionConcurrency
              - lambda:GetFunctionCodeSigningConfig
              - lambda:GetRuntimeManagementConfig
              - lambda:PutRuntimeManagementConfig
              - lambda:GetFunctionRecursionConfig
              - lambda:PutFunctionRecursionConfig
              - lambda:GetFunctionScalingConfig
              - lambda:AddPermission
              - lambda:RemovePermission
              - lambda:GetPolicy
              - lambda:PutFunctionEventInvokeConfig
              - lambda:UpdateFunctionEventInvokeConfig
              - lambda:DeleteFunctionEventInvokeConfig
              - lambda:GetFunctionEventInvokeConfig
            Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppStackName}-*
          # Custom::InitialData runs with this role's credentials: seed function only.
          - Sid: InvokeInitialDataFunction
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppStackName}-SeedFunction-*
          # Reads and changes that grant nothing, with no condition: a role of an
          # older deploy, without a boundary, can still be cleaned up. None of
          # these sets, changes or removes a boundary.
          - Sid: FunctionRoles
            Effect: Allow
            Action:
              - iam:DeleteRole
              - iam:GetRole
              - iam:UpdateRole
              - iam:UpdateRoleDescription
              - iam:TagRole
              - iam:UntagRole
              - iam:ListRoleTags
              - iam:GetRolePolicy
              - iam:DeleteRolePolicy
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppStackName}-*
          # What gives a function role permissions only with FunctionBoundaryPolicy
          # as its boundary (#179): the requested one on CreateRole and
          # PutRolePermissionsBoundary, the current one on the others. No
          # DeleteRolePermissionsBoundary: a boundary, once set, stays.
          - Sid: FunctionRolesWithBoundary
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:PutRolePermissionsBoundary
              - iam:PutRolePolicy
              - iam:UpdateAssumeRolePolicy
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppStackName}-*
            Condition:
              ArnEquals:
                iam:PermissionsBoundary: !Ref FunctionBoundaryPolicy
          # Only AWSLambdaBasicExecutionRole (what SAM attaches), with the boundary.
          - Sid: FunctionRolesManagedPolicy
            Effect: Allow
            Action: iam:AttachRolePolicy
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppStackName}-*
            Condition:
              ArnEquals:
                iam:PolicyARN: !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
                iam:PermissionsBoundary: !Ref FunctionBoundaryPolicy
          # Detaching grants nothing: no boundary condition.
          - Sid: FunctionRolesDetachManagedPolicy
            Effect: Allow
            Action: iam:DetachRolePolicy
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppStackName}-*
            Condition:
              ArnEquals:
                iam:PolicyARN: !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
          # PassRole has no iam:PermissionsBoundary key; every role the execution
          # role writes has the boundary (README, "O que continua aberto").
          - Sid: PassFunctionRolesToLambda
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AppStackName}-*
            Condition:
              StringEquals:
                iam:PassedToService: lambda.amazonaws.com
          # Lambda reads the code with the caller's credentials: PackagesBucket, or
          # the SAM CLI bucket of a manual "sam deploy --s3-prefix <AppStackName>".
          - Sid: ReadFunctionPackages
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource:
              - !Sub ${PackagesBucket.Arn}/${AppStackName}/*
              - !Sub arn:${AWS::Partition}:s3:::aws-sam-cli-managed-default-samclisourcebucket-*/${AppStackName}/*
          # Even if this stack were named "<AppStackName>-...", the execution role
          # could only read packages here. The function roles get the same denial
          # from their boundary (#179).
          - Sid: NeverManageTheCdBuckets
            Effect: Deny
            NotAction:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource:
              - !GetAtt ArtifactsBucket.Arn
              - !Sub ${ArtifactsBucket.Arn}/*
              - !GetAtt PackagesBucket.Arn
              - !Sub ${PackagesBucket.Arn}/*

  ExecutionDataPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub cd-${AppStackName}-cfn-exec-data
      Path: /cd/
      Roles:
        - !Ref CloudFormationExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # AWS::DynamoDB::Table: control plane only, no item access.
          - Sid: DynamoDBTables
            Effect: Allow
            Action:
              - dynamodb:CreateTable
              - dynamodb:DeleteTable
              - dynamodb:DescribeTable
              - dynamodb:UpdateTable
              - dynamodb:DescribeContinuousBackups
              - dynamodb:UpdateContinuousBackups
              - dynamodb:DescribeTimeToLive
              - dynamodb:UpdateTimeToLive
              - dynamodb:DescribeContributorInsights
              - dynamodb:UpdateContributorInsights
              - dynamodb:DescribeKinesisStreamingDestination
              - dynamodb:ListTagsOfResource
              - dynamodb:TagResource
              - dynamodb:UntagResource
              - dynamodb:GetResourcePolicy
            Resource:
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppStackName}-*
              - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppStackName}-*/index/*
          # ImagesBucket and its policy: configuration only, never the objects.
          - Sid: S3Buckets
            Effect: Allow
            Action:
              - s3:CreateBucket
              - s3:DeleteBucket
              - s3:ListBucket
              - s3:GetBucketAcl
              - s3:PutBucketPublicAccessBlock
              - s3:GetBucketPublicAccessBlock
              - s3:PutEncryptionConfiguration
              - s3:GetEncryptionConfiguration
              - s3:PutBucketOwnershipControls
              - s3:GetBucketOwnershipControls
              - s3:PutBucketPolicy
              - s3:GetBucketPolicy
              - s3:DeleteBucketPolicy
              - s3:PutBucketTagging
              - s3:GetBucketTagging
              - s3:TagResource
              - s3:UntagResource
              - s3:ListTagsForResource
              - s3:GetAccelerateConfiguration
              - s3:GetLifecycleConfiguration
              - s3:GetAnalyticsConfiguration
              - s3:GetBucketCORS
              - s3:GetInventoryConfiguration
              - s3:GetBucketLogging
              - s3:GetMetricsConfiguration
              - s3:GetBucketNotification
              - s3:GetBucketVersioning
              - s3:GetReplicationConfiguration
              - s3:GetBucketWebsite
              - s3:GetBucketObjectLockConfiguration
              - s3:GetIntelligentTieringConfiguration
              - s3:GetBucketAbac
              - s3:GetBucketMetadataTableConfiguration
            Resource: !Sub arn:${AWS::Partition}:s3:::${AppStackName}-*
          # The functions' log group, /aws/lambda/<AppStackName>.
          - Sid: FunctionsLogGroup
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:PutRetentionPolicy
              - logs:DeleteRetentionPolicy
              - logs:TagResource
              - logs:UntagResource
              - logs:ListTagsForResource
              - logs:GetDataProtectionPolicy
              - logs:DeleteDataProtectionPolicy
            Resource:
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppStackName}
              - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AppStackName}:*
          # No resource-level permission in IAM, hence "*".
          - Sid: LogsDescribeNoResourceLevel
            Effect: Allow
            Action:
              - logs:DescribeLogGroups
              - logs:DescribeIndexPolicies
              - logs:DescribeResourcePolicies
            Resource: "*"

  ExecutionIdentityApiPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub cd-${AppStackName}-cfn-exec-identity-api
      Path: /cd/
      Roles:
        - !Ref CloudFormationExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # No resource-level permission in IAM, hence "*".
          - Sid: CognitoCreateUserPool
            Effect: Allow
            Action: cognito-idp:CreateUserPool
            Resource: "*"
          # Pool ids are random: the pools of this account and Region.
          - Sid: CognitoUserPools
            Effect: Allow
            Action:
              - cognito-idp:DescribeUserPool
              - cognito-idp:UpdateUserPool
              - cognito-idp:DeleteUserPool
              - cognito-idp:SetUserPoolMfaConfig
              - cognito-idp:GetUserPoolMfaConfig
              - cognito-idp:AddCustomAttributes
              - cognito-idp:TagResource
              - cognito-idp:UntagResource
              - cognito-idp:ListTagsForResource
              - cognito-idp:CreateUserPoolClient
              - cognito-idp:DescribeUserPoolClient
              - cognito-idp:UpdateUserPoolClient
              - cognito-idp:DeleteUserPoolClient
              - cognito-idp:ListUserPoolClientSecrets
              - cognito-idp:CreateGroup
              - cognito-idp:GetGroup
              - cognito-idp:UpdateGroup
              - cognito-idp:DeleteGroup
              - cognito-idp:AdminCreateUser
              - cognito-idp:AdminGetUser
              - cognito-idp:AdminDeleteUser
              - cognito-idp:AdminAddUserToGroup
              - cognito-idp:AdminListGroupsForUser
              - cognito-idp:AdminRemoveUserFromGroup
            Resource: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*
          # Serverless::HttpApi (ApiGatewayV2 Api and Stage); API ids are random.
          - Sid: HttpApi
            Effect: Allow
            Action:
              - apigateway:GET
              - apigateway:POST
              - apigateway:PUT
              - apigateway:PATCH
              - apigateway:DELETE
            Resource:
              - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis
              - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*
              - !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/tags/*
          # AWS::Budgets::Budget named "<AppStackName>-mensal".
          - Sid: Budget
            Effect: Allow
            Action:
              - budgets:ViewBudget
              - budgets:ModifyBudget
              - budgets:TagResource
              - budgets:UntagResource
              - budgets:ListTagsForResource
            Resource: !Sub arn:${AWS::Partition}:budgets::${AWS::AccountId}:budget/${AppStackName}-*

  # --------------------------------------------------------------- Pipeline
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub cd-${AppStackName}-pipeline
      Path: /cd/
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pipeline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PipelineArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                Resource: !Sub ${ArtifactsBucket.Arn}/*
              - Sid: PipelineArtifactsBucket
                Effect: Allow
                Action:
                  - s3:GetBucketVersioning
                  - s3:GetBucketAcl
                  - s3:GetBucketLocation
                Resource: !GetAtt ArtifactsBucket.Arn
              # Both prefixes, as the connection action page asks.
              - Sid: UseConnection
                Effect: Allow
                Action:
                  - codeconnections:UseConnection
                  - codestar-connections:UseConnection
                Resource: !GetAtt GitHubConnection.ConnectionArn
              - Sid: RunBuild
                Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !GetAtt BuildProject.Arn
              # Change sets of the app stack only (no Create, Update or
              # DeleteStack), and only with the execution role
              # (cloudformation:RoleArn).
              - Sid: AppStackCreateChangeSet
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*
                Condition:
                  ArnEquals:
                    cloudformation:RoleArn: !GetAtt CloudFormationExecutionRole.Arn
              - Sid: AppStackChangeSets
                Effect: Allow
                Action:
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*
              # Also here as a precaution: with a service role, the transforms are
              # checked against the execution role, and the documentation does not
              # say whether the caller is checked too (README). No RoleArn
              # condition: this alone creates no change set.
              - Sid: AppTemplateTransforms
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:aws:transform/LanguageExtensions
              # Asked by the CloudFormation action; no resource-level permission, hence "*".
              - Sid: ValidateTemplate
                Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: "*"
              - Sid: PassExecutionRoleToCloudFormation
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Ref AWS::StackName
      PipelineType: V2
      ExecutionMode: QUEUED
      RestartExecutionOnUpdate: false
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactsBucket
      Stages:
        # No trigger (DetectChanges false, no Triggers): runs start by hand. The
        # automatic run at creation fails at Source (connection PENDING).
        - Name: Source
          Actions:
            - Name: Source
              Namespace: SourceVariables
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !GetAtt GitHubConnection.ConnectionArn
                FullRepositoryId: !Ref RepositoryId
                BranchName: !Ref BranchName
                DetectChanges: "false"
                OutputArtifactFormat: CODEBUILD_CLONE_REF
              OutputArtifacts:
                - Name: SourceOutput
              RunOrder: 1
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref BuildProject
                EnvironmentVariables: '[{"name":"SOURCE_COMMIT","value":"#{SourceVariables.CommitId}","type":"PLAINTEXT"}]'
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
              RunOrder: 1
        # Change set, approval and execution in ONE stage: QUEUED locks a stage
        # while an execution is in it, so no other run replaces the change set
        # that waits for approval.
        - Name: Deploy
          Actions:
            - Name: CreateChangeSet
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              Configuration:
                ActionMode: CHANGE_SET_REPLACE
                StackName: !Ref AppStackName
                ChangeSetName: codepipeline-changeset
                TemplatePath: BuildOutput::packaged.yaml
                RoleArn: !GetAtt CloudFormationExecutionRole.Arn
                Capabilities: CAPABILITY_IAM,CAPABILITY_AUTO_EXPAND
                # The size of this JSON is counted in the comment of AllowedOrigin.
                ParameterOverrides: !Sub >-
                  {"Environment": "${Environment}", "AdminEmail": "${AdminEmail}",
                  "AllowedOrigin": "${AllowedOrigin}", "BudgetLimitUsd": "${BudgetLimitUsd}",
                  "FunctionPermissionsBoundary": "${FunctionBoundaryPolicy}"}
              InputArtifacts:
                - Name: BuildOutput
              RunOrder: 1
            - Name: ApproveChangeSet
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: "1"
              Configuration:
                CustomData: !Sub >-
                  Commit #{SourceVariables.CommitId}. Antes de aprovar, abra o change set
                  codepipeline-changeset da stack ${AppStackName} (CloudFormation > Stacks >
                  ${AppStackName} > Conjuntos de alterações) e confira cada recurso; pare se
                  UserPool ou uma tabela aparecer com Replacement True ou Conditional.
                ExternalEntityLink: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudformation/home?region=${AWS::Region}#/stacks?filteringText=${AppStackName}
              RunOrder: 2
            - Name: ExecuteChangeSet
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: "1"
              Configuration:
                ActionMode: CHANGE_SET_EXECUTE
                StackName: !Ref AppStackName
                ChangeSetName: codepipeline-changeset
              RunOrder: 3

Outputs:
  PipelineName:
    Description: Nome do pipeline (start-pipeline-execution --name).
    Value: !Ref Pipeline
  ConnectionArn:
    Description: Conexão com o GitHub. Nasce PENDING; conclua no console.
    Value: !GetAtt GitHubConnection.ConnectionArn
  ArtifactsBucketName:
    Description: Artefatos do pipeline (expiram em 30 dias). Esvazie antes de apagar a stack.
    Value: !Ref ArtifactsBucket
  PackagesBucketName:
    Description: Pacotes das funções (sam package). Esvazie antes de apagar a stack.
    Value: !Ref PackagesBucket
  ExecutionRoleArn:
    Description: Papel de serviço que o CloudFormation usa na stack do app.
    Value: !GetAtt CloudFormationExecutionRole.Arn
  FunctionPermissionsBoundaryArn:
    Description: >-
      Limite de permissões dos papéis das funções (card #179). A esteira o passa à stack do app no
      parâmetro FunctionPermissionsBoundary; use o mesmo valor num sam deploy manual.
    Value: !Ref FunctionBoundaryPolicy
