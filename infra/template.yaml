AWSTemplateFormatVersion: "2010-09-09"
# LanguageExtensions must come before SAM: it resolves the !If in
# DeletionPolicy/UpdateReplacePolicy before the SAM transform runs.
Transform: [AWS::LanguageExtensions, AWS::Serverless-2016-10-31]
Description: Academia de Judô — exames de graduação (backend serverless)

Parameters:
  AdminEmail:
    Type: String
    Description: E-mail do primeiro examinador. O Cognito envia a ele uma senha temporária.
  # A list (dev: localhost + Amplify; prod: Amplify only). The name stays
  # singular so existing "AllowedOrigin=..." overrides keep working.
  # CloudFormation checks AllowedPattern against each item of the list: only
  # https:// hosts or http://localhost, optional port, no path, no trailing
  # slash, no wildcard (the API takes the Authorization header, so "*" would
  # let any site call it with a stolen token).
  AllowedOrigin:
    Type: CommaDelimitedList
    Default: http://localhost:5173
    AllowedPattern: '^(https://[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+|http://localhost)(:[0-9]{1,5})?$'
    ConstraintDescription: >-
      cada origem deve ser https://dominio (ou http://localhost no desenvolvimento), em
      minúsculas, sem barra no fim, sem caminho, sem espaços e sem *.
    Description: >-
      Origens do front-end liberadas no CORS, separadas por vírgula e sem espaços. No dev,
      http://localhost:5173 e o domínio do Amplify; no prod, só o domínio do Amplify
      (https://main.<appid>.amplifyapp.com). Origem não leva barra no fim.
  BudgetLimitUsd:
    Type: Number
    Default: 1
    Description: Limite mensal (US$) do alerta do AWS Budgets.
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: >-
      dev usa DynamoDB provisionado dentro do free tier (25 RCU/25 WCU), sem PITR e
      logs por 7 dias; prod usa on-demand com PITR, como pede a arquitetura.

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Mappings:
  # Settings per environment.
  EnvConfig:
    # CopyItemsPerSecond: pace of the background copy of a requirement profile
    # (#144). In dev each copied item costs 1 WCU in Requirements and in each
    # of its 2 GSIs (4 WCU each): 2 items/s leaves half to the exam marking,
    # and ~700 items take ~6 min. Prod is on-demand.
    # DeleteItemsPerSecond: pace of the background deletion of a requirement
    # profile's items (#144). A deleted item costs the same as a copied one
    # (1 WCU in Requirements and in each of its 2 GSIs), so the same pace.
    dev:
      LogRetentionDays: 7
      CopyItemsPerSecond: "2"
      DeleteItemsPerSecond: "2"
    prod:
      LogRetentionDays: 30
      CopyItemsPerSecond: "10"
      DeleteItemsPerSecond: "10"
  # Provisioned capacity used only in dev (prod is PAY_PER_REQUEST). The free
  # tier covers 25 RCU and 25 WCU summed over every table and GSI of the
  # account in the Region; these add up to 25 RCU and 25 WCU (none spare).
  # Requirements, by_belt and by_profile_belt get the most WCU for the 692-item
  # seed and the move to the main profile (#144): a write to the table also
  # writes both GSIs, so each runs at min(4, 4, 4) items/s. by_profile_belt
  # does not project answer_count, so a mark never writes to it. Its 4 WCU came
  # from Students and StudentsByOwner (2 -> 1 each), Answers (3 -> 2) and the
  # spare unit. Since step 3a of #144 every read of a profile's items (exam
  # sheet, score after each mark, lists, copy) queries by_profile_belt, the main
  # profile included once the v2 migration finished, so it takes the read
  # capacity by_belt had (by_belt 5 -> 1 RCU, by_profile_belt 1 -> 5): the
  # Brown belt sheet costs ~4.5 RCU whatever the number of profiles. by_belt is
  # still written until it is dropped (step 3c) and is read only by the
  # fallback of the main profile while the v2 migration has not finished.
  # Each mark (RN006) is a transaction that checks the exam and the event and
  # writes the answer: 2 WCU in each of Exams, Events and Answers (plus 2 in
  # Requirements and the by_belt write on the first mark of an item), and its
  # response reads the sheet's items (by_profile_belt) and the exam's answers.
  # The answers query is strongly consistent (1 RCU per 4 KB): ~2.5 RCU per mark
  # on a 58-item belt, up to 10 on a full 139-item exam (see backend/README.md).
  DevCapacity:
    Belts:
      Read: 2
      Write: 1
    Students:
      Read: 3
      Write: 1
    StudentsByOwner:
      Read: 2
      Write: 1
    Exams:
      Read: 2
      Write: 3
    ExamsByStudent:
      Read: 1
      Write: 1
    Requirements:
      Read: 3
      Write: 4
    RequirementsByBelt:
      Read: 1
      Write: 4
    RequirementsByProfileBelt:
      Read: 5
      Write: 4
    Settings:
      Read: 1
      Write: 1
    Events:
      Read: 2
      Write: 3
    Answers:
      Read: 3
      Write: 2

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: ../backend/src
    Timeout: 10
    MemorySize: 256
    LoggingConfig:
      LogGroup: !Ref FunctionsLogGroup
    Environment:
      Variables:
        LOG_LEVEL: INFO
        BELTS_TABLE: !Ref BeltsTable
        STUDENTS_TABLE: !Ref StudentsTable
        EXAMS_TABLE: !Ref ExamsTable
        REQUIREMENTS_TABLE: !Ref RequirementsTable
        SETTINGS_TABLE: !Ref SettingsTable
        EVENTS_TABLE: !Ref EventsTable
        ANSWERS_TABLE: !Ref AnswersTable

Resources:
  # ---------------------------------------------------------------- DynamoDB
  # Tables are kept in prod. In dev they are deleted with the stack (and on a
  # failed Create rollback), so orphaned PROVISIONED tables never eat the
  # account-wide 25 RCU/WCU free tier of the next deploy.
  BeltsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BillingMode: !If [IsProd, PAY_PER_REQUEST, PROVISIONED]
      ProvisionedThroughput: !If
        - IsProd
        - !Ref AWS::NoValue
        - ReadCapacityUnits: !FindInMap [DevCapacity, Belts, Read]
          WriteCapacityUnits: !FindInMap [DevCapacity, Belts, Write]
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]

  StudentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BillingMode: !If [IsProd, PAY_PER_REQUEST, PROVISIONED]
      ProvisionedThroughput: !If
        - IsProd
        - !Ref AWS::NoValue
        - ReadCapacityUnits: !FindInMap [DevCapacity, Students, Read]
          WriteCapacityUnits: !FindInMap [DevCapacity, Students, Write]
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: owner_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: by_owner
          KeySchema:
            - AttributeName: owner_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput: !If
            - IsProd
            - !Ref AWS::NoValue
            - ReadCapacityUnits: !FindInMap [DevCapacity, StudentsByOwner, Read]
              WriteCapacityUnits: !FindInMap [DevCapacity, StudentsByOwner, Write]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]

  ExamsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BillingMode: !If [IsProd, PAY_PER_REQUEST, PROVISIONED]
      ProvisionedThroughput: !If
        - IsProd
        - !Ref AWS::NoValue
        - ReadCapacityUnits: !FindInMap [DevCapacity, Exams, Read]
          WriteCapacityUnits: !FindInMap [DevCapacity, Exams, Write]
      AttributeDefinitions:
        - AttributeName: event_id
          AttributeType: S
        - AttributeName: student_id
          AttributeType: S
      KeySchema:
        - AttributeName: event_id
          KeyType: HASH
        - AttributeName: student_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: by_student
          KeySchema:
            - AttributeName: student_id
              KeyType: HASH
            - AttributeName: event_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput: !If
            - IsProd
            - !Ref AWS::NoValue
            - ReadCapacityUnits: !FindInMap [DevCapacity, ExamsByStudent, Read]
              WriteCapacityUnits: !FindInMap [DevCapacity, ExamsByStudent, Write]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]

  RequirementsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BillingMode: !If [IsProd, PAY_PER_REQUEST, PROVISIONED]
      ProvisionedThroughput: !If
        - IsProd
        - !Ref AWS::NoValue
        - ReadCapacityUnits: !FindInMap [DevCapacity, Requirements, Read]
          WriteCapacityUnits: !FindInMap [DevCapacity, Requirements, Write]
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: belt_id
          AttributeType: S
        - AttributeName: sort_order
          AttributeType: N
        - AttributeName: profile_belt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      # CloudFormation creates or deletes only one GSI per table update:
      # by_profile_belt is added now, and by_belt goes in a later deploy.
      GlobalSecondaryIndexes:
        - IndexName: by_belt
          KeySchema:
            - AttributeName: belt_id
              KeyType: HASH
            - AttributeName: sort_order
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput: !If
            - IsProd
            - !Ref AWS::NoValue
            - ReadCapacityUnits: !FindInMap [DevCapacity, RequirementsByBelt, Read]
              WriteCapacityUnits: !FindInMap [DevCapacity, RequirementsByBelt, Write]
        # Items of one requirement profile in a belt (profile_belt =
        # "<profile_id>#<belt_id>"), in sheet order. Every field of the model
        # is projected but answer_count, so the first mark of an item (RN006)
        # does not write here. A new model field must be added to the list.
        - IndexName: by_profile_belt
          KeySchema:
            - AttributeName: profile_belt
              KeyType: HASH
            - AttributeName: sort_order
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - belt_id
              - kind
              - category
              - description
              - expected_answer
              - profile_id
          ProvisionedThroughput: !If
            - IsProd
            - !Ref AWS::NoValue
            - ReadCapacityUnits: !FindInMap [DevCapacity, RequirementsByProfileBelt, Read]
              WriteCapacityUnits: !FindInMap [DevCapacity, RequirementsByProfileBelt, Write]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]

  EventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BillingMode: !If [IsProd, PAY_PER_REQUEST, PROVISIONED]
      ProvisionedThroughput: !If
        - IsProd
        - !Ref AWS::NoValue
        - ReadCapacityUnits: !FindInMap [DevCapacity, Events, Read]
          WriteCapacityUnits: !FindInMap [DevCapacity, Events, Write]
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]

  # Exam answers (RN006): one item per (exam, requirement); PK is the exam's UUID.
  AnswersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BillingMode: !If [IsProd, PAY_PER_REQUEST, PROVISIONED]
      ProvisionedThroughput: !If
        - IsProd
        - !Ref AWS::NoValue
        - ReadCapacityUnits: !FindInMap [DevCapacity, Answers, Read]
          WriteCapacityUnits: !FindInMap [DevCapacity, Answers, Write]
      AttributeDefinitions:
        - AttributeName: exam_id
          AttributeType: S
        - AttributeName: requirement_id
          AttributeType: S
      KeySchema:
        - AttributeName: exam_id
          KeyType: HASH
        - AttributeName: requirement_id
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]

  # Academy settings (single record) and markers such as the initial-data load.
  SettingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BillingMode: !If [IsProd, PAY_PER_REQUEST, PROVISIONED]
      ProvisionedThroughput: !If
        - IsProd
        - !Ref AWS::NoValue
        - ReadCapacityUnits: !FindInMap [DevCapacity, Settings, Read]
          WriteCapacityUnits: !FindInMap [DevCapacity, Settings, Write]
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]

  # ---------------------------------------------------------------------- S3
  # Academy images (RN012): logos under logos/, certificate signatures under
  # signatures/. Private: no public access, no ACLs, TLS only; the
  # API hands out 5-minute presigned GET URLs. Name generated by CloudFormation.
  # Same policy as the tables: kept in prod; deleted with the dev stack, which
  # CloudFormation only manages if the bucket is empty (empty it first).
  ImagesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  ImagesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ImagesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ImagesBucket.Arn
              - !Sub ${ImagesBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # ----------------------------------------------------------------- Cognito
  # Kept in prod like the tables: students keep the guardian's sub in owner_id
  # (RN013), so a new pool would break that link. The resources that hold data
  # inside the pool (examiner/master/guardian groups, first examiner and their
  # memberships) follow the same policy; otherwise deleting the prod stack would
  # strip the roles from the retained pool. Retain does not stop a replacement:
  # review the prod change set for Replacement on UserPool (see backend/README.md).
  # The client holds no data and is recreated with the stack in both environments.
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      # Blocks deleting the pool from the Console/CLI in prod; dev stays deletable.
      DeletionProtection: !If [IsProd, ACTIVE, INACTIVE]
      UsernameAttributes: [email]
      # Decided for dev and prod (2026-11-02). Set only at creation. CloudFormation
      # does not replace the pool when it changes, so changing it requires deleting
      # and recreating the pool (or the stack).
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
          RequireUppercase: false
      LambdaConfig:
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: admin
      Description: Examinadores

  GuardianGroup:
    Type: AWS::Cognito::UserPoolGroup
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: responsavel
      Description: Responsáveis e alunos (cadastro aberto)

  FirstAdminUser:
    Type: AWS::Cognito::UserPoolUser
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      UserPoolId: !Ref UserPool
      Username: !Ref AdminEmail
      DesiredDeliveryMediums: [EMAIL]
      UserAttributes:
        - Name: email
          Value: !Ref AdminEmail
        - Name: email_verified
          Value: "true"

  FirstAdminInGroup:
    Type: AWS::Cognito::UserPoolUserToGroupAttachment
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: !Ref AdminGroup
      Username: !Ref FirstAdminUser

  # Admin master (decision of 2026-11-02): an examiner who also chooses the
  # sensei. Members are added only here (the first examiner) or by the
  # Console/CLI; no API route writes to this group.
  MasterGroup:
    Type: AWS::Cognito::UserPoolGroup
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: master
      Description: Administrador master (examinador que escolhe o sensei)

  FirstAdminInMasterGroup:
    Type: AWS::Cognito::UserPoolUserToGroupAttachment
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: !Ref MasterGroup
      Username: !Ref FirstAdminUser

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.cognito_triggers.post_confirmation
      Policies:
        - Statement:
            - Effect: Allow
              Action: cognito-idp:AdminAddUserToGroup
              # Pool ARN by wildcard: referencing UserPool here would create a circular dependency.
              Resource: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*

  PostConfirmationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PostConfirmationFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # --------------------------------------------------------------------- API
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        # The list goes in as is: AWS::LanguageExtensions resolves the Ref to a
        # literal list before SAM writes x-amazon-apigateway-cors. Wrapping it
        # in another list (or Fn::Split) would break the CORS block.
        AllowOrigins: !Ref AllowedOrigin
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        MaxAge: 600
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient

  # Belts
  ListBeltsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.belts.list_belts
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BeltsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /belts
            Method: GET

  UpdateBeltFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.belts.update_belt
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BeltsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /belts/{id}
            Method: PUT

  # Students
  ListStudentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.students.list_students
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BeltsTable
        - DynamoDBReadPolicy:
            TableName: !Ref StudentsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /students
            Method: GET

  CreateStudentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.students.create_student
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BeltsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StudentsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /students
            Method: POST

  GetStudentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.students.get_student
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BeltsTable
        - DynamoDBReadPolicy:
            TableName: !Ref StudentsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /students/{id}
            Method: GET

  UpdateStudentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.students.update_student
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BeltsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StudentsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ExamsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /students/{id}
            Method: PUT

  DeleteStudentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.students.delete_student
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StudentsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ExamsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /students/{id}
            Method: DELETE

  # Exam history of a student (examiners only, RN018). Read-only: GetItem of
  # the student (decides the 404), Query on the by_student index (every
  # page), BatchGetItem of the exams' events (names and dates) and Scan of
  # the belts (names). The answers are never read.
  ListStudentExamsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.students.list_student_exams
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt StudentsTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub ${ExamsTable.Arn}/index/by_student
            - Effect: Allow
              Action: dynamodb:BatchGetItem
              Resource: !GetAtt EventsTable.Arn
            - Effect: Allow
              Action: dynamodb:Scan
              Resource: !GetAtt BeltsTable.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /students/{id}/exams
            Method: GET

  # Exam notices of a guardian's student (RN019). Read-only: GetItem of the
  # student (decides the 404), Scan of the events (a few per year; only the
  # open ones count), Query on the by_student index (the student's exams) and
  # Scan of the belts (eligibility on each event's date). Nothing is written.
  ListStudentExamNoticesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.students.list_student_exam_notices
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt StudentsTable.Arn
            - Effect: Allow
              Action: dynamodb:Scan
              Resource: !GetAtt EventsTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub ${ExamsTable.Arn}/index/by_student
            - Effect: Allow
              Action: dynamodb:Scan
              Resource: !GetAtt BeltsTable.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /students/{id}/exam-notices
            Method: GET

  # Requirements (examiners only). Each function also reads the requirement
  # profiles item of Settings (only that item: dynamodb:LeadingKeys) to find
  # a profile other than the main one (#144). The list and the creation (the
  # default order reads the belt) also read the v2 migration marker, which
  # tells when the main profile may be read through by_profile_belt.
  ListRequirementsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.requirements.list_requirements
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BeltsTable
        - DynamoDBReadPolicy:
            TableName: !Ref RequirementsTable
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys:
                    - requirement_profiles
                    - migration:requirements:profile-belt:v2
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /requirements
            Method: GET

  CreateRequirementFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.requirements.create_requirement
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BeltsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RequirementsTable
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys:
                    - requirement_profiles
                    - migration:requirements:profile-belt:v2
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /requirements
            Method: POST

  UpdateRequirementFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.requirements.update_requirement
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BeltsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RequirementsTable
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [requirement_profiles]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /requirements/{id}
            Method: PUT

  DeleteRequirementFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.requirements.delete_requirement
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RequirementsTable
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [requirement_profiles]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /requirements/{id}
            Method: DELETE

  # Requirement profiles (examiners only, RN017, #144). Every profile but the
  # main one (not stored) lives in a single item of Settings
  # (id requirement_profiles): each function reaches only that item
  # (dynamodb:LeadingKeys), never the settings record nor the signatures, and
  # none of them scans the table. No new table or GSI (dev free tier).
  ListRequirementProfilesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.requirement_profiles.list_profiles
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [requirement_profiles]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /requirement-profiles
            Method: GET

  GetRequirementProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.requirement_profiles.get_profile
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [requirement_profiles]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /requirement-profiles/{id}
            Method: GET

  # Stores the profile COPYING (PutItem for the first profile, then a
  # conditional UpdateItem) and starts the copy with an asynchronous Invoke of
  # the copy function, the only function it may invoke.
  CreateRequirementProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.requirement_profiles.create_profile
      Environment:
        Variables:
          REQUIREMENT_PROFILE_COPY_FUNCTION: !Ref CopyRequirementProfileFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [requirement_profiles]
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt CopyRequirementProfileFunction.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /requirement-profiles
            Method: POST

  UpdateRequirementProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.requirement_profiles.rename_profile
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [requirement_profiles]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /requirement-profiles/{id}
            Method: PUT

  # Resumes a stalled copy: conditional UpdateItem (still copying and
  # stalled), then the same asynchronous Invoke as the creation.
  ResumeRequirementProfileCopyFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.requirement_profiles.resume_copy
      Environment:
        Variables:
          REQUIREMENT_PROFILE_COPY_FUNCTION: !Ref CopyRequirementProfileFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [requirement_profiles]
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt CopyRequirementProfileFunction.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /requirement-profiles/{id}/copy
            Method: POST

  # Background copy of a profile (no route; invoked only by the two functions
  # above, InvocationType=Event). Reads the belts (Scan), the source's and the
  # copy's items (Query on by_profile_belt; on by_belt only for the main
  # profile while the v2 migration marker, GetItem, is not there yet),
  # writes each missing copy (conditional PutItem) and the progress and status
  # of the profile (UpdateItem on its item of Settings). ~700 items at
  # CopyItemsPerSecond take ~6 min in dev; a run stops 60 s before the
  # timeout and fails, and Lambda retries it (2 retries, ~1 and ~2 min later),
  # going on from what was written. The resume route covers the rest.
  CopyRequirementProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.requirement_profile_copy.handler
      Timeout: 900
      Environment:
        Variables:
          COPY_ITEMS_PER_SECOND: !FindInMap [EnvConfig, !Ref Environment, CopyItemsPerSecond]
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 3600
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [requirement_profiles]
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [migration:requirements:profile-belt:v2]
            - Effect: Allow
              Action: dynamodb:Scan
              Resource: !GetAtt BeltsTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !Sub ${RequirementsTable.Arn}/index/by_belt
                - !Sub ${RequirementsTable.Arn}/index/by_profile_belt
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt RequirementsTable.Arn

  # Deletes a profile other than the main one that no event uses (RN017,
  # #144, step 3b-2). Stores the profile DELETING (conditional UpdateItem on
  # the profiles item), then reads every event (strongly consistent Scan of
  # Events, the only function of the profiles that reads another table) and
  # starts the deletion of the items with an asynchronous Invoke of the
  # function below, the only function it may invoke. It never touches
  # Requirements.
  DeleteRequirementProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.requirement_profiles.delete_profile
      Environment:
        Variables:
          REQUIREMENT_PROFILE_DELETE_FUNCTION: !Ref DeleteRequirementProfileItemsFunction
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [requirement_profiles]
            - Effect: Allow
              Action: dynamodb:Scan
              Resource: !GetAtt EventsTable.Arn
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !GetAtt DeleteRequirementProfileItemsFunction.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /requirement-profiles/{id}
            Method: DELETE

  # Background deletion of the items of a profile being deleted (no route;
  # invoked only by the function above, InvocationType=Event). A function of
  # its own, not an action of the copy function: the copy never deletes an
  # item and this one never writes one. Reads the belts (Scan) and the ids of
  # the profile's items (Query on by_profile_belt only, never by_belt nor the
  # table), deletes each one (conditional DeleteItem: of this profile, with no
  # answers) and writes its sign of life and, at the end, the removal of the
  # profile (UpdateItem on the profiles item of Settings). ~700 items at
  # DeleteItemsPerSecond take ~6 min in dev; a run stops 60 s before the
  # timeout and fails, and Lambda retries it (2 retries), going on from what
  # is left. Repeating the DELETE of a stalled profile covers the rest.
  DeleteRequirementProfileItemsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.requirement_profile_delete.handler
      Timeout: 900
      Environment:
        Variables:
          DELETE_ITEMS_PER_SECOND: !FindInMap [EnvConfig, !Ref Environment, DeleteItemsPerSecond]
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 3600
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [requirement_profiles]
            - Effect: Allow
              Action: dynamodb:Scan
              Resource: !GetAtt BeltsTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !Sub ${RequirementsTable.Arn}/index/by_profile_belt
            - Effect: Allow
              Action: dynamodb:DeleteItem
              Resource: !GetAtt RequirementsTable.Arn

  # Exam events (examiners only, RN016). An event chooses its requirement
  # profile (#144): the create and update functions read the profiles item of
  # Settings (GetItem) and, when the event starts using a profile other than
  # the main one, write the event in a TransactWriteItems with a
  # ConditionCheck that the profile is READY in that item. Only that item
  # (dynamodb:LeadingKeys), never the settings record nor the signatures.
  ListEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.events.list_events
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /events
            Method: GET

  CreateEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.events.create_event
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:ConditionCheckItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [requirement_profiles]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /events
            Method: POST

  GetEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.events.get_event
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /events/{id}
            Method: GET

  UpdateEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.events.update_event
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        # A change of profile is refused once the event has exams: Query in
        # Exams for the early answer (the write is conditioned on exam_count).
        - Statement:
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt ExamsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:ConditionCheckItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [requirement_profiles]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /events/{id}
            Method: PUT

  DeleteEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.events.delete_event
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ExamsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /events/{id}
            Method: DELETE

  # Attendance and exams of an event (examiners only, RN005)
  ConfirmAttendanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.exams.confirm_attendance
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BeltsTable
        # TransactWriteItems: Put in Exams + conditional Update (ADD exam_count)
        # in Events + conditional Update in Students (ADD exam_count and SET
        # the exam-in-progress marker exam_in_progress_id only while absent,
        # RN005). GetItem afterwards to translate a failed condition.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt ExamsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt EventsTable.Arn
                - !GetAtt StudentsTable.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /events/{id}/exams
            Method: POST

  ListEventExamsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.exams.list_event_exams
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt EventsTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt ExamsTable.Arn
            - Effect: Allow
              Action: dynamodb:BatchGetItem
              Resource: !GetAtt StudentsTable.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /events/{id}/exams
            Method: GET

  # Exam sheet and marking (examiners only, RN006/RN007). The sheet's items
  # (and the score after a mark or unmark) come from by_profile_belt; the main
  # profile comes from by_belt only until the v2 migration finished, which
  # they learn from its marker in Settings (GetItem on that item only, once
  # per container: dynamodb:LeadingKeys).
  GetExamSheetFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.exams.get_exam_sheet
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource:
                - !GetAtt EventsTable.Arn
                - !GetAtt ExamsTable.Arn
                - !GetAtt StudentsTable.Arn
                - !GetAtt BeltsTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !Sub ${RequirementsTable.Arn}/index/by_belt
                - !Sub ${RequirementsTable.Arn}/index/by_profile_belt
                - !GetAtt AnswersTable.Arn
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [migration:requirements:profile-belt:v2]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /events/{id}/exams/{student_id}
            Method: GET

  MarkAnswerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.exams.mark_answer
      Policies:
        # TransactWriteItems: ConditionCheck on Exams and Events + Put or
        # Update in Answers + Update ADD answer_count in Requirements on the
        # first answer, or ConditionCheck (same belt) in Requirements when
        # replacing. GetItem reads the items again to explain a failure.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:ConditionCheckItem
              Resource:
                - !GetAtt EventsTable.Arn
                - !GetAtt ExamsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:ConditionCheckItem
              Resource: !GetAtt RequirementsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
              Resource: !GetAtt AnswersTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !Sub ${RequirementsTable.Arn}/index/by_belt
                - !Sub ${RequirementsTable.Arn}/index/by_profile_belt
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [migration:requirements:profile-belt:v2]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /events/{id}/exams/{student_id}/answers/{requirement_id}
            Method: PUT

  UnmarkAnswerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.exams.unmark_answer
      Policies:
        # TransactWriteItems: ConditionCheck on Exams and Events + Delete in
        # Answers + Update ADD answer_count -1 in Requirements.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:ConditionCheckItem
              Resource:
                - !GetAtt EventsTable.Arn
                - !GetAtt ExamsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt RequirementsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:DeleteItem
                - dynamodb:Query
              Resource: !GetAtt AnswersTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !Sub ${RequirementsTable.Arn}/index/by_belt
                - !Sub ${RequirementsTable.Arn}/index/by_profile_belt
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [migration:requirements:profile-belt:v2]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /events/{id}/exams/{student_id}/answers/{requirement_id}
            Method: DELETE

  # Sensei's decision (examiners only; the handler allows only the sensei, RN008-RN010)
  DecideExamFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.exams.decide_exam
      Policies:
        # GetItem: event, exam, student and the settings (the sensei) before
        # the write. TransactWriteItems: conditional Update in Exams (status
        # IN_PROGRESS) + conditional Update in Students on the graduation of
        # the attendance (removes the exam-in-progress marker, RN005; on
        # approval also writes the new graduation) + ConditionCheck in
        # Settings that the decider is still the sensei (RN008); GetItem
        # there again to translate a failed check. Scan in Belts only for
        # exams confirmed before that graduation was stored.
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt EventsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:ConditionCheckItem
              Resource: !GetAtt SettingsTable.Arn
              # Only the settings record: never the signatures item (RN012).
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [academy]
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt ExamsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt StudentsTable.Arn
            - Effect: Allow
              Action: dynamodb:Scan
              Resource: !GetAtt BeltsTable.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /events/{id}/exams/{student_id}/decision
            Method: POST

  # Academy settings and the sensei selector (examiners only, § 3.7/§ 6.6).
  # USER_POOL_ID and the pool ARN are set per function, never in Globals: the
  # pool references PostConfirmationFunction (LambdaConfig), so giving that
  # function a reference to the pool would be a circular dependency. These
  # functions are not referenced by the pool, so !Ref/!GetAtt UserPool is safe.
  GetSettingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.settings.get_settings
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt SettingsTable.Arn
              # Only the settings record: never the signatures item (RN012).
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [academy]
            - Effect: Allow
              Action: cognito-idp:ListUsersInGroup
              Resource: !GetAtt UserPool.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /settings
            Method: GET

  UpdateSettingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.settings.update_settings
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
      Policies:
        # UpdateItem with ReturnValues ALL_NEW: no read before the write.
        - Statement:
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt SettingsTable.Arn
              # Only the settings record: never the signatures item (RN012).
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [academy]
            - Effect: Allow
              Action: cognito-idp:ListUsersInGroup
              Resource: !GetAtt UserPool.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /settings
            Method: PUT

  ListExaminersFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.users.list_examiners
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
      Policies:
        - Statement:
            - Effect: Allow
              Action: cognito-idp:ListUsersInGroup
              Resource: !GetAtt UserPool.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /examiners
            Method: GET

  # Academy logos (examiners only, RN012). Each function gets the bucket name
  # and only the S3 action it uses, limited to logos/*; the metadata lives in
  # the settings record. The upload body (base64 of at most 2 MB, ~2.8 MB of
  # JSON) fits the HTTP API (10 MB) and Lambda (6 MB) payload limits, and the
  # default timeout and memory decode and store it with room to spare.
  PutLogoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.logos.put_logo
      Environment:
        Variables:
          IMAGES_BUCKET: !Ref ImagesBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub ${ImagesBucket.Arn}/logos/*
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt SettingsTable.Arn
              # Only the settings record: never the signatures item (RN012).
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [academy]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /settings/logos/{slot}
            Method: PUT

  DeleteLogoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.logos.delete_logo
      Environment:
        Variables:
          IMAGES_BUCKET: !Ref ImagesBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub ${ImagesBucket.Arn}/logos/*
            - Effect: Allow
              Action: dynamodb:UpdateItem
              Resource: !GetAtt SettingsTable.Arn
              # Only the settings record: never the signatures item (RN012).
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [academy]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /settings/logos/{slot}
            Method: DELETE

  # The presigned URL carries this function's permissions: s3:GetObject on
  # logos/* is what lets the browser download the logo for 5 minutes.
  GetLogoFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.logos.get_logo
      Environment:
        Variables:
          IMAGES_BUCKET: !Ref ImagesBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${ImagesBucket.Arn}/logos/*
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt SettingsTable.Arn
              # Only the settings record: never the signatures item (RN012).
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [academy]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /settings/logos/{slot}
            Method: GET

  # Certificate signatures (RN012): only the master and the sensei, checked by
  # the handler against the settings on every request and again inside each
  # write transaction. The list is one item of the Settings table
  # (id certificate_signatures); every function is limited to the items it
  # needs (dynamodb:LeadingKeys) and, when it touches S3, to signatures/* with
  # only the actions it uses. No logo function reaches signatures/*, and no
  # signature function reaches logos/*.
  ListSignaturesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.signatures.list_signatures
      Policies:
        - Statement:
            # Reads the sensei (settings record) and the list, nothing else.
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [academy, certificate_signatures]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /settings/signatures
            Method: GET

  CreateSignatureFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.signatures.create_signature
      Policies:
        - Statement:
            # Reads the sensei (settings record) and the list, nothing else.
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [academy, certificate_signatures]
            # Transaction: ConditionCheck that the caller is still the sensei
            # (settings record) + conditional Put of the list (its own item).
            - Effect: Allow
              Action: dynamodb:ConditionCheckItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [academy]
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [certificate_signatures]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /settings/signatures
            Method: POST

  # The static path wins over /settings/signatures/{id} in the HTTP API
  # (most specific route); ids are UUIDs, never "order".
  ReorderSignaturesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.signatures.reorder_signatures
      Policies:
        - Statement:
            # Reads the sensei (settings record) and the list, nothing else.
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [academy, certificate_signatures]
            # Transaction: ConditionCheck that the caller is still the sensei
            # (settings record) + conditional Put of the list (its own item).
            - Effect: Allow
              Action: dynamodb:ConditionCheckItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [academy]
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [certificate_signatures]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /settings/signatures/order
            Method: PUT

  UpdateSignatureFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.signatures.update_signature
      Policies:
        - Statement:
            # Reads the sensei (settings record) and the list, nothing else.
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [academy, certificate_signatures]
            # Transaction: ConditionCheck that the caller is still the sensei
            # (settings record) + conditional Put of the list (its own item).
            - Effect: Allow
              Action: dynamodb:ConditionCheckItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [academy]
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [certificate_signatures]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /settings/signatures/{id}
            Method: PUT

  # Removing a signature also deletes its image.
  DeleteSignatureFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.signatures.delete_signature
      Environment:
        Variables:
          IMAGES_BUCKET: !Ref ImagesBucket
      Policies:
        - Statement:
            # Reads the sensei (settings record) and the list, nothing else.
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [academy, certificate_signatures]
            # Transaction: ConditionCheck that the caller is still the sensei
            # (settings record) + conditional Put of the list (its own item).
            - Effect: Allow
              Action: dynamodb:ConditionCheckItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [academy]
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [certificate_signatures]
            - Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub ${ImagesBucket.Arn}/signatures/*
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /settings/signatures/{id}
            Method: DELETE

  # Every upload goes to a new key signatures/{id}/{uuid} chosen by the API.
  # DeleteObject drops that key when the metadata transaction fails, and the
  # previously recorded key once the new one is recorded.
  PutSignatureImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.signatures.put_signature_image
      Environment:
        Variables:
          IMAGES_BUCKET: !Ref ImagesBucket
      Policies:
        - Statement:
            # Reads the sensei (settings record) and the list, nothing else.
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [academy, certificate_signatures]
            # Transaction: ConditionCheck that the caller is still the sensei
            # (settings record) + conditional Put of the list (its own item).
            - Effect: Allow
              Action: dynamodb:ConditionCheckItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [academy]
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [certificate_signatures]
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:DeleteObject
              Resource: !Sub ${ImagesBucket.Arn}/signatures/*
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /settings/signatures/{id}/image
            Method: PUT

  DeleteSignatureImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.signatures.delete_signature_image
      Environment:
        Variables:
          IMAGES_BUCKET: !Ref ImagesBucket
      Policies:
        - Statement:
            # Reads the sensei (settings record) and the list, nothing else.
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [academy, certificate_signatures]
            # Transaction: ConditionCheck that the caller is still the sensei
            # (settings record) + conditional Put of the list (its own item).
            - Effect: Allow
              Action: dynamodb:ConditionCheckItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [academy]
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [certificate_signatures]
            - Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub ${ImagesBucket.Arn}/signatures/*
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /settings/signatures/{id}/image
            Method: DELETE

  # The presigned URL carries this function's permissions: s3:GetObject on
  # signatures/* is what lets the browser download the image for 5 minutes.
  GetSignatureImageFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.signatures.get_signature_image
      Environment:
        Variables:
          IMAGES_BUCKET: !Ref ImagesBucket
      Policies:
        - Statement:
            # Reads the sensei (settings record) and the list, nothing else.
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt SettingsTable.Arn
              Condition:
                ForAllValues:StringEquals:
                  dynamodb:LeadingKeys: [academy, certificate_signatures]
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${ImagesBucket.Arn}/signatures/*
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /settings/signatures/{id}/image
            Method: GET

  # ------------------------------------------------------------ Initial data
  SeedFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.seed.handler
      # Lambda maximum. With 4 WCU the 692 items take ~3 min (the seed on a new
      # stack, or the move to the main profile, #144, on the next deploy of an
      # existing one); the handler stops 60 s before this limit and answers
      # FAILED, so the stack never hangs.
      Timeout: 900
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BeltsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RequirementsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SettingsTable

  InitialData:
    Type: Custom::InitialData
    # The profile migrations run only after the functions that write
    # requirements run the new code: code from before profiles, still
    # answering, could otherwise create or move an item without profile_belt
    # after the v2 migration checked it (#144, step 3a).
    DependsOn:
      - CreateRequirementFunction
      - UpdateRequirementFunction
    Properties:
      ServiceToken: !GetAtt SeedFunction.Arn
      # Seconds CloudFormation waits for an answer (default 3600) if the
      # function dies without replying; a bit more than its timeout.
      ServiceTimeout: 960
      # Bump to re-run the (idempotent) seed on the next deploy. "3": moves the
      # requirements to the main profile (#144). "4": the v2 migration, which
      # fixes profile_belt on every item before the main profile is read
      # through by_profile_belt (#144, step 3a).
      SeedVersion: "4"

  # -------------------------------------------------------------------- Logs
  # One log group for every function (Globals.LoggingConfig), with a short
  # retention instead of the implicit /aws/lambda/<name> groups kept forever.
  # Each function writes its own streams, named after the function.
  FunctionsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}
      RetentionInDays: !FindInMap [EnvConfig, !Ref Environment, LogRetentionDays]

  # ------------------------------------------------------------------ Custos
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-mensal
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AdminEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AdminEmail

Outputs:
  ApiUrl:
    Description: URL base da API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
