AWSTemplateFormatVersion: "2010-09-09"
# LanguageExtensions must come before SAM: it resolves the !If in
# DeletionPolicy/UpdateReplacePolicy before the SAM transform runs.
Transform: [AWS::LanguageExtensions, AWS::Serverless-2016-10-31]
Description: Academia de Judô — exames de graduação (backend serverless)

Parameters:
  AdminEmail:
    Type: String
    Description: E-mail do primeiro examinador. O Cognito envia a ele uma senha temporária.
  AllowedOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Origem do front-end liberada no CORS (troque pela URL do Amplify).
  BudgetLimitUsd:
    Type: Number
    Default: 1
    Description: Limite mensal (US$) do alerta do AWS Budgets.
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: >-
      dev usa DynamoDB provisionado dentro do free tier (25 RCU/25 WCU), sem PITR e
      logs por 7 dias; prod usa on-demand com PITR, como pede a arquitetura.

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Mappings:
  # Settings per environment.
  EnvConfig:
    dev:
      LogRetentionDays: 7
    prod:
      LogRetentionDays: 30
  # Provisioned capacity used only in dev (prod is PAY_PER_REQUEST). The free
  # tier covers 25 RCU and 25 WCU summed over every table and GSI of the
  # account in the Region; these add up to 25 RCU and 25 WCU exactly.
  # Requirements and by_belt get the most WCU for the 692-item seed (a write
  # to the table also writes the GSI, so the seed runs at min(7, 7) items/s).
  DevCapacity:
    Belts:
      Read: 3
      Write: 1
    Students:
      Read: 3
      Write: 2
    StudentsByOwner:
      Read: 2
      Write: 2
    Exams:
      Read: 2
      Write: 2
    ExamsByStudent:
      Read: 1
      Write: 1
    Requirements:
      Read: 6
      Write: 7
    RequirementsByBelt:
      Read: 4
      Write: 7
    Settings:
      Read: 2
      Write: 1
    Events:
      Read: 2
      Write: 2

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: ../backend/src
    Timeout: 10
    MemorySize: 256
    LoggingConfig:
      LogGroup: !Ref FunctionsLogGroup
    Environment:
      Variables:
        LOG_LEVEL: INFO
        BELTS_TABLE: !Ref BeltsTable
        STUDENTS_TABLE: !Ref StudentsTable
        EXAMS_TABLE: !Ref ExamsTable
        REQUIREMENTS_TABLE: !Ref RequirementsTable
        SETTINGS_TABLE: !Ref SettingsTable
        EVENTS_TABLE: !Ref EventsTable

Resources:
  # ---------------------------------------------------------------- DynamoDB
  # Tables are kept in prod. In dev they are deleted with the stack (and on a
  # failed Create rollback), so orphaned PROVISIONED tables never eat the
  # account-wide 25 RCU/WCU free tier of the next deploy.
  BeltsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BillingMode: !If [IsProd, PAY_PER_REQUEST, PROVISIONED]
      ProvisionedThroughput: !If
        - IsProd
        - !Ref AWS::NoValue
        - ReadCapacityUnits: !FindInMap [DevCapacity, Belts, Read]
          WriteCapacityUnits: !FindInMap [DevCapacity, Belts, Write]
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]

  StudentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BillingMode: !If [IsProd, PAY_PER_REQUEST, PROVISIONED]
      ProvisionedThroughput: !If
        - IsProd
        - !Ref AWS::NoValue
        - ReadCapacityUnits: !FindInMap [DevCapacity, Students, Read]
          WriteCapacityUnits: !FindInMap [DevCapacity, Students, Write]
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: owner_id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: by_owner
          KeySchema:
            - AttributeName: owner_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput: !If
            - IsProd
            - !Ref AWS::NoValue
            - ReadCapacityUnits: !FindInMap [DevCapacity, StudentsByOwner, Read]
              WriteCapacityUnits: !FindInMap [DevCapacity, StudentsByOwner, Write]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]

  ExamsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BillingMode: !If [IsProd, PAY_PER_REQUEST, PROVISIONED]
      ProvisionedThroughput: !If
        - IsProd
        - !Ref AWS::NoValue
        - ReadCapacityUnits: !FindInMap [DevCapacity, Exams, Read]
          WriteCapacityUnits: !FindInMap [DevCapacity, Exams, Write]
      AttributeDefinitions:
        - AttributeName: event_id
          AttributeType: S
        - AttributeName: student_id
          AttributeType: S
      KeySchema:
        - AttributeName: event_id
          KeyType: HASH
        - AttributeName: student_id
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: by_student
          KeySchema:
            - AttributeName: student_id
              KeyType: HASH
            - AttributeName: event_id
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput: !If
            - IsProd
            - !Ref AWS::NoValue
            - ReadCapacityUnits: !FindInMap [DevCapacity, ExamsByStudent, Read]
              WriteCapacityUnits: !FindInMap [DevCapacity, ExamsByStudent, Write]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]

  RequirementsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BillingMode: !If [IsProd, PAY_PER_REQUEST, PROVISIONED]
      ProvisionedThroughput: !If
        - IsProd
        - !Ref AWS::NoValue
        - ReadCapacityUnits: !FindInMap [DevCapacity, Requirements, Read]
          WriteCapacityUnits: !FindInMap [DevCapacity, Requirements, Write]
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: belt_id
          AttributeType: S
        - AttributeName: sort_order
          AttributeType: N
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: by_belt
          KeySchema:
            - AttributeName: belt_id
              KeyType: HASH
            - AttributeName: sort_order
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
          ProvisionedThroughput: !If
            - IsProd
            - !Ref AWS::NoValue
            - ReadCapacityUnits: !FindInMap [DevCapacity, RequirementsByBelt, Read]
              WriteCapacityUnits: !FindInMap [DevCapacity, RequirementsByBelt, Write]
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]

  EventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BillingMode: !If [IsProd, PAY_PER_REQUEST, PROVISIONED]
      ProvisionedThroughput: !If
        - IsProd
        - !Ref AWS::NoValue
        - ReadCapacityUnits: !FindInMap [DevCapacity, Events, Read]
          WriteCapacityUnits: !FindInMap [DevCapacity, Events, Write]
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]

  # Academy settings (single record) and markers such as the initial-data load.
  SettingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: !If [IsProd, Retain, Delete]
    UpdateReplacePolicy: !If [IsProd, Retain, Delete]
    Properties:
      BillingMode: !If [IsProd, PAY_PER_REQUEST, PROVISIONED]
      ProvisionedThroughput: !If
        - IsProd
        - !Ref AWS::NoValue
        - ReadCapacityUnits: !FindInMap [DevCapacity, Settings, Read]
          WriteCapacityUnits: !FindInMap [DevCapacity, Settings, Write]
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [IsProd, true, false]

  # ----------------------------------------------------------------- Cognito
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
          RequireUppercase: false
      LambdaConfig:
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: admin
      Description: Examinadores

  GuardianGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: responsavel
      Description: Responsáveis e alunos (cadastro aberto)

  FirstAdminUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref UserPool
      Username: !Ref AdminEmail
      DesiredDeliveryMediums: [EMAIL]
      UserAttributes:
        - Name: email
          Value: !Ref AdminEmail
        - Name: email_verified
          Value: "true"

  FirstAdminInGroup:
    Type: AWS::Cognito::UserPoolUserToGroupAttachment
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: !Ref AdminGroup
      Username: !Ref FirstAdminUser

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.cognito_triggers.post_confirmation
      Policies:
        - Statement:
            - Effect: Allow
              Action: cognito-idp:AdminAddUserToGroup
              # Pool ARN by wildcard: referencing UserPool here would create a circular dependency.
              Resource: !Sub arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*

  PostConfirmationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PostConfirmationFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # --------------------------------------------------------------------- API
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        MaxAge: 600
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience:
                - !Ref UserPoolClient

  # Belts
  ListBeltsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.belts.list_belts
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BeltsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /belts
            Method: GET

  UpdateBeltFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.belts.update_belt
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BeltsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /belts/{id}
            Method: PUT

  # Students
  ListStudentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.students.list_students
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BeltsTable
        - DynamoDBReadPolicy:
            TableName: !Ref StudentsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /students
            Method: GET

  CreateStudentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.students.create_student
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BeltsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StudentsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /students
            Method: POST

  GetStudentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.students.get_student
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BeltsTable
        - DynamoDBReadPolicy:
            TableName: !Ref StudentsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /students/{id}
            Method: GET

  UpdateStudentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.students.update_student
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BeltsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StudentsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ExamsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /students/{id}
            Method: PUT

  DeleteStudentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.students.delete_student
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StudentsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ExamsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /students/{id}
            Method: DELETE

  # Requirements (examiners only)
  ListRequirementsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.requirements.list_requirements
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BeltsTable
        - DynamoDBReadPolicy:
            TableName: !Ref RequirementsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /requirements
            Method: GET

  CreateRequirementFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.requirements.create_requirement
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BeltsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RequirementsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /requirements
            Method: POST

  UpdateRequirementFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.requirements.update_requirement
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BeltsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RequirementsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /requirements/{id}
            Method: PUT

  DeleteRequirementFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.requirements.delete_requirement
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RequirementsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /requirements/{id}
            Method: DELETE

  # Exam events (examiners only, RN016)
  ListEventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.events.list_events
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /events
            Method: GET

  CreateEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.events.create_event
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /events
            Method: POST

  GetEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.events.get_event
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref EventsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /events/{id}
            Method: GET

  UpdateEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.events.update_event
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /events/{id}
            Method: PUT

  DeleteEventFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.events.delete_event
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref EventsTable
        - DynamoDBReadPolicy:
            TableName: !Ref ExamsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /events/{id}
            Method: DELETE

  # Attendance and exams of an event (examiners only, RN005)
  ConfirmAttendanceFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.exams.confirm_attendance
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BeltsTable
        # TransactWriteItems: Put in Exams + conditional Update (ADD exam_count)
        # in Events and Students.
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt ExamsTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource:
                - !GetAtt EventsTable.Arn
                - !GetAtt StudentsTable.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /events/{id}/exams
            Method: POST

  ListEventExamsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.exams.list_event_exams
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:GetItem
              Resource: !GetAtt EventsTable.Arn
            - Effect: Allow
              Action: dynamodb:Query
              Resource: !GetAtt ExamsTable.Arn
            - Effect: Allow
              Action: dynamodb:BatchGetItem
              Resource: !GetAtt StudentsTable.Arn
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /events/{id}/exams
            Method: GET

  # ------------------------------------------------------------ Initial data
  SeedFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.seed.handler
      # Lambda maximum. With 7 WCU the 692 items take ~2 min; the handler stops
      # 60 s before this limit and answers FAILED, so the stack never hangs.
      Timeout: 900
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BeltsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RequirementsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SettingsTable

  InitialData:
    Type: Custom::InitialData
    Properties:
      ServiceToken: !GetAtt SeedFunction.Arn
      # Seconds CloudFormation waits for an answer (default 3600) if the
      # function dies without replying; a bit more than its timeout.
      ServiceTimeout: 960
      # Bump to re-run the (idempotent) seed on the next deploy.
      SeedVersion: "2"

  # -------------------------------------------------------------------- Logs
  # One log group for every function (Globals.LoggingConfig), with a short
  # retention instead of the implicit /aws/lambda/<name> groups kept forever.
  # Each function writes its own streams, named after the function.
  FunctionsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}
      RetentionInDays: !FindInMap [EnvConfig, !Ref Environment, LogRetentionDays]

  # ------------------------------------------------------------------ Custos
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub ${AWS::StackName}-mensal
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AdminEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AdminEmail

Outputs:
  ApiUrl:
    Description: URL base da API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
