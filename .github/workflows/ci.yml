name: CI

on:
  # Branches de trabalho rodam pelo PR; o push só roda no main (evita jobs duplicados).
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Áreas alteradas
    # Decide quais áreas rodam. Os jobs de área são pulados por `if` (job pulado conta como
    # aprovado na proteção do branch); `paths:` no workflow não é usado porque um workflow
    # que não roda não reporta as checagens obrigatórias e trava o PR.
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      infra: ${{ steps.areas.outputs.infra }}
      frontend: ${{ steps.areas.outputs.frontend }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Listar arquivos alterados
        id: areas
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          backend=false
          infra=false
          frontend=false

          # Base da comparação:
          # - PR: o que o PR traz em relação ao branch de destino;
          # - push numa branch de trabalho: o que ela traz em relação ao branch principal;
          # - push no branch principal: o que o push trouxe (sem o commit anterior, roda tudo).
          base=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base=$(git merge-base "origin/${BASE_REF}" HEAD)
          elif [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            base=$(git merge-base "origin/${DEFAULT_BRANCH}" "$SHA")
          elif [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          fi

          if [ -z "$base" ]; then
            echo "Sem base de comparação: roda todas as áreas."
            backend=true
            infra=true
            frontend=true
          else
            # quotePath=false: caminhos com acento saem crus, sem aspas.
            files=$(git -c core.quotePath=false diff --name-only "$base" "$SHA")
            echo "Arquivos alterados desde ${base}:"
            echo "${files:-(nenhum)}"
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                backend/*)
                  # O template empacota o código do backend: infra roda junto.
                  backend=true
                  infra=true
                  ;;
                infra/*) infra=true ;;
                frontend/*) frontend=true ;;
                requirements/* | .claude/* | *.md) ;;
                *)
                  # .github/, arquivos da raiz (.gitignore, .gitattributes...) e qualquer
                  # outro caminho: roda tudo.
                  backend=true
                  infra=true
                  frontend=true
                  ;;
              esac
            done <<< "$files"
          fi

          {
            echo "backend=$backend"
            echo "infra=$infra"
            echo "frontend=$frontend"
          } >> "$GITHUB_OUTPUT"
          echo "backend=$backend infra=$infra frontend=$frontend"

  backend:
    name: Backend (lint e testes)
    needs: changes
    # Se a detecção falhar, roda mesmo assim (falha aberta): pular aqui aprovaria a checagem.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalar dependências
        run: uv sync --locked --python 3.12
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Formatação
        run: uv run ruff format --check src tests scripts
      - name: Testes (inclui regressões)
        run: uv run pytest -q

  infra:
    name: Template SAM (cfn-lint)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.infra == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Validar infra/template.yaml
        run: uv run --project backend --locked --python 3.12 cfn-lint infra/template.yaml

  frontend:
    name: Frontend (lint, tipos, testes e build)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tipos
        run: npm run typecheck
      - name: Formatação
        run: npm run format:check
      - name: Testes (inclui regressões)
        run: npm test
      - name: Build
        run: npm run build

  regression:
    name: Correção traz teste de regressão
    # Branches de correção (fix/*) precisam adicionar ou alterar um teste de regressão.
    # Vale para qualquer área: não depende da detecção de caminhos.
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'fix/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Exigir teste em backend/ ou frontend/tests/regression/
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only --diff-filter=AM "origin/${BASE_REF}...HEAD" -- backend/tests/regression/ frontend/tests/regression/ \
            | grep -E '^backend/tests/regression/test_[^/]+\.py$|^frontend/tests/regression/[^/]+\.test\.tsx?$' || true)
          if [ -z "$changed" ]; then
            echo "::error::Branches fix/* precisam de um teste em backend/tests/regression/ ou frontend/tests/regression/ que reproduza o erro."
            exit 1
          fi
          echo "Testes de regressão neste PR:"
          echo "$changed"
